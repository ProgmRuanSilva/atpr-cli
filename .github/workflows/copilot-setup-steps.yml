name: "Copilot Setup Steps"

# Run automatically when this file changes to validate the setup steps,
# and allow manual testing from the Actions tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "stable"

            - name: Install Fabric AI
              run: |
                  go install github.com/danielmiessler/fabric@v1.4.452
                  echo "$HOME/go/bin" >> "$GITHUB_PATH"

            - name: Install pull_request pattern
              run: |
                  if [ ! -d "sample/pull_request" ]; then
                    echo "Error: sample/pull_request directory not found" >&2
                    exit 1
                  fi
                  mkdir -p "$HOME/.config/fabric/patterns/"
                  cp -R sample/pull_request "$HOME/.config/fabric/patterns/"

            - name: Install atpr command
              run: |
                  if [ ! -f "atpr.sh" ]; then
                    echo "Error: atpr.sh not found in repository root" >&2
                    exit 1
                  fi
                  chmod +x atpr.sh
                  sudo cp atpr.sh /usr/local/bin/atpr
